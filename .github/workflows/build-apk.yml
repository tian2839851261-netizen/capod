name: Build CAPod foss APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate temporary signing key
        run: |
          keytool -genkeypair -keystore ${{ runner.temp }}/capod.keystore -storepass android -keypass android \
            -alias capod -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CAPod, O=Personal, C=CN"

      - name: Build foss release APK (minified, signed)
        env:
          STORE_PATH: ${{ runner.temp }}/capod.keystore
          STORE_PASSWORD: android
          KEY_ALIAS: capod
          KEY_PASSWORD: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossRelease --no-daemon

      - name: Verify APK
        run: |
          APK=$(ls app/build/outputs/apk/foss/release/*.apk | head -n 1)
          echo "Built APK: $APK"
          ls -lh "$APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: capod-foss-release-apk
          path: app/build/outputs/apk/foss/release/*.apk
